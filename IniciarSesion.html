
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>

    <style>
        /* --- Estilos Globales --- */
        :root {
            --color-primary: #6a1b9a;
            --color-accent-yellow: #ffca28;
            --color-accent-cyan: #00bcd4;
            --color-accent-pink: #e91e63;
            --color-text-dark: #333;
            --color-text-light: #f5f5f5;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- Marco del Navegador --- */
        .browser-frame {
            width: 900px;
            max-width: 100%;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .browser-frame::before {
            content: "";
            display: block;
            height: 30px;
            background-color: #f0f0f0;
            border-bottom: 1px solid #ddd;
            background-image:
                radial-gradient(circle, #ff5f56 6px, transparent 7px),
                radial-gradient(circle, #ffbd2e 6px, transparent 7px),
                radial-gradient(circle, #27c93f 6px, transparent 7px);
            background-position: 10px 50%, 30px 50%, 50px 50%;
            background-repeat: no-repeat;
        }

        /* --- Header --- */
        .site-header {
            background-color: var(--color-primary);
            color: var(--color-text-light);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 3px solid var(--color-accent-yellow);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            font-size: 2rem;
        }

        .site-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .main-nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .main-nav a {
            text-decoration: none;
            color: var(--color-text-light);
            font-weight: 500;
            padding: 8px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .main-nav a.active,
        .main-nav a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* --- Main --- */
        .site-main {
            display: flex;
            justify-content: center;
            padding: 40px 30px;
            gap: 40px;
        }

        /* --- Formulario de Registro --- */
        .content-section {
            width: 100%;
            max-width: 500px;
            border: 2px solid var(--color-accent-yellow);
            border-radius: 8px;
            padding: 30px;
            background-color: #fffcf5;
            box-shadow: 3px 3px 0 var(--color-accent-yellow);
        }

        .content-section h2 {
            font-size: 2rem;
            color: var(--color-text-dark);
            margin-bottom: 15px;
            text-align: center;
        }

        .content-section p {
            margin-bottom: 25px;
            line-height: 1.6;
            color: #555;
            text-align: center;
        }

        /* Campos del formulario */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-text-dark);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-family: var(--font-family);
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 5px rgba(106, 27, 154, 0.3);
        }

        /* Botón */
        .btn-register {
            display: block;
            width: 100%;
            padding: 13px;
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-register:hover {
            background-color: #4a148c;
            transform: translateY(-2px);
        }

        /* --- Footer --- */
        .site-footer {
            background-color: var(--color-accent-pink);
            color: var(--color-text-light);
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            border-top: 3px solid var(--color-primary);
        }

        /* --- Adaptación a móviles --- */
        @media (max-width: 600px) {
            .site-header {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }

            .site-main {
                padding: 25px 15px;
            }

            .content-section {
                padding: 20px;
            }

            .content-section h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <div class="browser-frame">

        <!-- Encabezado y navegación -->
        <header class="site-header">
            <div class="logo-container">
                <span class="logo-icon">📝</span>
                <span class="site-title">Registro de usuario</span>
            </div>

            <nav class="main-nav">
                <ul>
                    <li>
                        <a href="PaginadeInicio.php">Inicio</a>
                    </li>
                    <li>
                        <a href="contacto.php">Contacto</a>
                    </li>
                </ul>
            </nav>
        </header>

        <!-- Contenido principal -->
        <main class="site-main">

            <section class="content-section">
                <h2>Formulario de Registro</h2>

                <p>
                    Bienvenido. Completa tus datos para registrarte.
                </p>

                <form action="inicio.php" method="POST">

                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Escribe tu nombre"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="correo">E-mail:</label>
                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="ejemplo@correo.com"
                            required
                        >
                    </div>
                    
<div class="form-group">
    <label for="contrasena">Contraseña:</label>
    <input
        type="password"
        id="contrasena"
        name="contrasena"
        placeholder="Escribe tu contraseña"
        required
    >
</div>


                    <button type="submit" class="btn-register">
                        Registrarme
                    </button>

                </form>
            </section>

        </main>

        <!-- Pie de página -->
        <footer class="site-footer">
            <p>Formulario de Registro &copy; 2026</p>
        </footer>

    </div>

</body>
</html>
